<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Forza 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1430; overflow: hidden; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1430; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #9db4ff; font: 600 14px system-ui, sans-serif; }
    #bar { width: 160px; height: 6px; border-radius: 3px; background: #1c2a55; overflow: hidden; margin-top: 10px; }
    #fill { height: 100%; width: 0; background: #3b82f6; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>3D<div id="bar"><div id="fill"></div></div></div></div>
  <script src="Build/unity3d.loader.js"></script>
  <script>
    // The match page (the football manager) sends what to draw with postMessage; it is handed on to Unity.
    // Unity is told through the "Bridge" object (MatchRoot.cs). Until it is ready, only the newest state is kept.
    var unity = null;
    var queue = [];
    var latest = null;
    var isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);

    window.addEventListener("message", function (e) {
      var d = e.data;
      if (!d || d.src !== "forza") return;
      var json = JSON.stringify(d);
      if (!unity) {
        if (d.type === "state") latest = json; else queue.push(json);
        return;
      }
      unity.SendMessage("Bridge", "OnMessage", json);
    });

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/unity3d.data",
      frameworkUrl: "Build/unity3d.framework.js",
      codeUrl: "Build/unity3d.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Forza 3D",
      productVersion: "0.1.0",
      devicePixelRatio: isMobile ? 1.5 : 1,
    }, function (p) {
      document.getElementById("fill").style.width = Math.round(p * 100) + "%";
    }).then(function (instance) {
      unity = instance;
      document.getElementById("loading").style.display = "none";
      queue.forEach(function (j) { unity.SendMessage("Bridge", "OnMessage", j); });
      if (latest) unity.SendMessage("Bridge", "OnMessage", latest);
      queue = [];
      window.parent.postMessage({src: "forza-unity", type: "ready"}, "*");
    }).catch(function (m) {
      document.getElementById("loading").textContent = String(m);
    });
  </script>
</body>
</html>
